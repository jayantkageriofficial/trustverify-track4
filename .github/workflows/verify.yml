name: Verify Track 4 prototype

on: [push, pull_request]

permissions:
  contents: read

jobs:
  adapter:
    # Mirrors the offline judging runtime: Python 3.12 plus pqcrypto only, no cryptography.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install judging-runtime dependencies only
        run: python -m pip install 'pqcrypto==0.4.0' 'pytest==9.2.0'
      - name: Confirm cryptography is absent
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('cryptography') is not None)"
      - name: Fetch the Track 4 toolkit
        run: git clone --depth 1 https://github.com/ScalerOpenSourceLabs/Track-4-Toolkit ../Track-4-Toolkit
      - name: Adapter and practice-detector tests
        run: python -m pytest -q -p no:cacheprovider tests/test_adapter.py tests/test_practice.py
      - name: Toolkit lost-device validator
        run: python ../Track-4-Toolkit/validate.py --entry track4_service.py
      - name: Assessor-style adapter attacks
        run: python scripts/attack_adapter.py
      - name: Detector on toolkit practice data
        run: python -m trustverify practice --toolkit ../Track-4-Toolkit/practice

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install from source
        run: python -m pip install '.[messaging,dev]'
      - name: Run functional and security regression tests
        run: python -m pytest -q
      - name: Run three-process protected workflow
        run: python -m trustverify demo --directory runtime/ci-demo
      - name: Verify independently anchored audit log
        run: >-
          python -m trustverify verify
          --log runtime/ci-demo/audit-export.json
          --trust runtime/ci-demo/operator/trust.json
          --checkpoint runtime/ci-demo/operator/checkpoint.json
      - name: Evaluate labelled logs
        run: python -m trustverify evaluate
      - name: Verify two-page brief generation
        run: python scripts/build_brief.py
      - name: Build container
        run: docker build --tag trustverify .
      - name: Run container regression tests
        run: docker run --rm --network none trustverify python -m pytest -q -p no:cacheprovider
      - name: Run container protected workflow
        run: docker run --rm --network none trustverify
